<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1012">
  <title>listRats</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=18">
  <link rel="stylesheet" href="css/layout.css?v=18">
  <link rel="stylesheet" href="css/components.css?v=18">
  <link rel="stylesheet" href="css/motion.css?v=18">
  <link rel="stylesheet" href="css/mobile.css?v=18">
  <script>
    // tema salvo (padrão: escuro) e estado do menu, antes de desenhar a página
    try {
      var t = localStorage.getItem("liga.theme");
      document.documentElement.dataset.theme = t === '"light"' ? "light" : "dark";
      if (localStorage.getItem("liga.navClosed") === "true") document.documentElement.classList.add("nav-closed");
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="side" id="side" aria-label="Menu">
      <div class="side-top">
        <button class="brand" type="button" id="brandBtn">
          <img class="mark" src="assets/icon.svg" alt="" width="26" height="26">
          <span>listRats</span>
        </button>
        <button class="icon-btn only-mobile" type="button" id="navClose" aria-label="Fechar menu"></button>
      </div>
      <nav class="nav" id="menu" aria-label="Menu principal"></nav>
      <div class="side-foot" id="userBox"></div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" type="button" id="navToggle" aria-label="Abrir ou fechar o menu" aria-controls="side"></button>
        <nav class="crumbs" id="crumbs" aria-label="Você está em"></nav>
      </header>
      <div class="status" id="status" role="status" hidden></div>
      <main id="view" class="stack">
        <div class="loading-line"></div>
      </main>
    </div>
  </div>

  <!-- celular: navegação fixa embaixo -->
  <nav class="tabbar" id="tabbar" aria-label="Navegação"></nav>

  <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Foto"></div>
  <div class="fx-layer" id="fx" aria-hidden="true"></div>

  <!-- ?v=18 em todos os arquivos: ao mudar o site, troque o número para o celular baixar a versão nova -->
  <!-- configuração (Firebase ou modo local) -->
  <script src="js/config.js?v=18" defer></script>
  <!-- utilitários -->
  <script src="js/util/dom.js?v=18" defer></script>
  <script src="js/util/text.js?v=18" defer></script>
  <script src="js/util/dates.js?v=18" defer></script>
  <script src="js/util/crypto.js?v=18" defer></script>
  <!-- regras do jogo e estado -->
  <script src="js/core/rules.js?v=18" defer></script>
  <script src="js/core/state.js?v=18" defer></script>
  <script src="js/core/scoring.js?v=18" defer></script>
  <script src="js/core/perms.js?v=18" defer></script>
  <script src="js/core/enroll.js?v=18" defer></script>
  <!-- dados e contas -->
  <script src="js/data/local.js?v=18" defer></script>
  <script src="js/data/firebase.js?v=18" defer></script>
  <!-- ações e interface -->
  <script src="js/actions.js?v=18" defer></script>
  <script src="js/social.js?v=18" defer></script>
  <script src="js/review.js?v=18" defer></script>
  <script src="js/ui/fx.js?v=18" defer></script>
  <script src="js/ui/components.js?v=18" defer></script>
  <script src="js/ui/forms.js?v=18" defer></script>
  <script src="js/ui/photos.js?v=18" defer></script>
  <script src="js/ui/tasks.js?v=18" defer></script>
  <script src="js/ui/shell.js?v=18" defer></script>
  <script src="js/ui/enroll-panel.js?v=18" defer></script>
  <!-- telas -->
  <script src="js/pages/login.js?v=18" defer></script>
  <script src="js/pages/home.js?v=18" defer></script>
  <script src="js/pages/projects.js?v=18" defer></script>
  <script src="js/pages/mine.js?v=18" defer></script>
  <script src="js/pages/rules.js?v=18" defer></script>
  <script src="js/pages/new-project.js?v=18" defer></script>
  <script src="js/pages/project.js?v=18" defer></script>
  <script src="js/pages/members.js?v=18" defer></script>
  <script src="js/pages/sub-form.js?v=18" defer></script>
  <script src="js/pages/sub.js?v=18" defer></script>
  <script src="js/pages/charts.js?v=18" defer></script>
  <script src="js/pages/friends.js?v=18" defer></script>
  <script src="js/pages/inbox.js?v=18" defer></script>
  <script src="js/pages/user.js?v=18" defer></script>
  <script src="js/pages/settings.js?v=18" defer></script>
  <!-- inicialização -->
  <script src="js/demo.js?v=18" defer></script>
  <script src="js/main.js?v=18" defer></script>
</body>
</html>
